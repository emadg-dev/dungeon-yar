<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1b08" />
      <stop offset="60%" stop-color="#14110b" />
      <stop offset="100%" stop-color="#0c0e12" />
    </radialGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#d97706" stroke-width="3" stroke-opacity="0.35" />

  <!-- Outer ancient time-circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#amberGold)" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="14 8" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.25" />

  <!-- Ember points -->
  <circle cx="256" cy="76" r="6" fill="#fef08a" filter="url(#glow)" />
  <circle cx="436" cy="256" r="6" fill="#fef08a" filter="url(#glow)" />
  <circle cx="256" cy="436" r="6" fill="#fef08a" filter="url(#glow)" />
  <circle cx="76" cy="256" r="6" fill="#fef08a" filter="url(#glow)" />

  <!-- Persian letter "ز" for Zorvania (زروانیا) -->
  <g filter="url(#glow)" transform="translate(256, 270)">
    <!-- Main curve of letter Ze -->
    <path d="M 60,-65 C 50,-5 20,65 -60,85 C -75,88 -85,82 -80,72 C -65,45 -25,-10 10,-75 C 20,-95 65,-95 60,-65 Z" fill="url(#amberGold)" />
    <!-- Dot of letter Ze -->
    <circle cx="45" cy="-145" r="22" fill="url(#amberGold)" />
    <circle cx="45" cy="-145" r="12" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
