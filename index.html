<!doctype html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%APP_TITLE%</title>
    <meta name="description" content="%APP_DESCRIPTION%" />
    <meta name="theme-color" content="#0E0D0C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%APP_SHORT_NAME%" />
    <meta name="application-name" content="%APP_SHORT_NAME%" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta property="og:title" content="%APP_TITLE%" />
    <meta property="og:description" content="%APP_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Preload Self-Hosted Vazirmatn woff2 (Primary 400 Arabic subset) -->
    <link rel="preload" href="/fonts/vazirmatn/vazirmatn-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="bg-bg text-text-primary selection:bg-accent/30 selection:text-accent-hover antialiased min-h-[100dvh]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
